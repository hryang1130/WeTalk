[SelfServer]
Name = resource
Port = 9090
Host = 0.0.0.0
RPCPort = 51055
[ResourceServer]
Port = 9090
Host = 0.0.0.0
RPCPort = 51055
; 上传目录 = 工作目录(cwd) / Output/Path / Static/Path = /app/data/img/<uid>/<文件名>
; 注意：boost::filesystem 的 operator/ 不会因为右侧是绝对路径而替换，写成 "/data" 会拼成
; /app/data，所以这里必须是相对路径。docker-compose 把 ./docker/data/resource 挂到 /app/data，
; 这样重建镜像/重启容器都不会丢图片（之前落在容器可写层，一重建就全没了）。
[Output]
Path = data
[Static]
Path = img
[Mysql]
Host = mysql
Port = 3306
User = root
Passwd = 123456
Schema = llfc
[Redis]
Host = redis
Port = 6379
Passwd = 123456
