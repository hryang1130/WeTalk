# 注意：re_reactor 的 tcp_client 用 inet_aton 解析 ip 字段，
# 不能填容器服务名，只能填点分 IP（compose 已固定各服务地址）
[reporter]
ip = 172.20.0.21
port = 7779

[dnsserver]
ip = 172.20.0.20
port = 7778

[loadbalance]
probe_num=10
init_succ_cnt=180
init_err_cnt=5
err_rate=0.1
succ_rate=0.5
contin_err_limit=15
contin_succ_limit=15
window_err_rate=0.7
idle_timeout=15
overload_timeout=15
update_timeout=15
