<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>WeTalk</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 登录 / 注册 -->
  <div id="view-auth" class="auth-wrap">
    <div class="auth-card">
      <h1 class="brand">WeTalk</h1>
      <div class="tabs">
        <button id="tab-login" class="tab active">登录</button>
        <button id="tab-register" class="tab">注册</button>
      </div>

      <form id="form-login" class="stack">
        <input id="login-email" placeholder="邮箱" autocomplete="username" />
        <input id="login-passwd" type="password" placeholder="密码" autocomplete="current-password" />
        <button type="submit" class="primary">登录</button>
        <div id="login-msg" class="msg"></div>
      </form>

      <form id="form-register" class="stack hidden">
        <input id="reg-email" placeholder="邮箱" />
        <div class="row">
          <input id="reg-varifycode" placeholder="邮箱验证码" />
          <button id="btn-varify" type="button" class="ghost">获取验证码</button>
        </div>
        <input id="reg-user" placeholder="用户名" />
        <input id="reg-nick" placeholder="昵称(可留空)" />
        <input id="reg-passwd" type="password" placeholder="密码" />
        <input id="reg-confirm" type="password" placeholder="确认密码" />
        <button type="submit" class="primary">注册</button>
        <div id="reg-msg" class="msg"></div>
      </form>
      <div class="hint">GateServer 默认 http://127.0.0.1:8080，可在登录前用 docker compose up 启动服务端</div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="view-main" class="main hidden">
    <aside class="sidebar">
      <header class="me">
        <div id="me-name" class="me-name">—</div>
        <div id="me-uid" class="me-uid"></div>
        <button id="btn-logout" class="ghost small">退出</button>
      </header>
      <div class="search-row">
        <input id="search-input" placeholder="搜索 uid / 用户名" />
        <button id="btn-search" class="ghost small">搜索</button>
      </div>
      <div id="search-result" class="search-result hidden"></div>
      <div class="section-title">好友</div>
      <ul id="friend-list" class="list"></ul>
      <div class="section-title">好友申请</div>
      <ul id="apply-list" class="list"></ul>
    </aside>

    <section class="chat-area">
      <header id="chat-title" class="chat-title">选择一个好友开始聊天</header>
      <div id="msg-list" class="msg-list"></div>
      <div class="composer">
        <textarea id="input-box" rows="2" placeholder="输入消息，Enter 发送（Shift+Enter 换行）"></textarea>
        <button id="btn-send" class="primary" disabled>发送</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
