<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:" />
  <title>WeTalk</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 登录 / 注册 -->
  <div id="view-auth" class="auth-wrap">
    <div class="auth-card">
      <div class="brand-badge">W</div>
      <h1 class="brand">WeTalk</h1>
      <div class="tabs">
        <button id="tab-login" class="tab active">登录</button>
        <button id="tab-register" class="tab">注册</button>
      </div>

      <form id="form-login" class="stack">
        <div class="field"><label>服务器</label><input id="gate-url" value="http://127.0.0.1:8080" /></div>
        <div class="field"><label>邮箱</label><input id="login-email" placeholder="you@example.com" autocomplete="username" /></div>
        <div class="field"><label>密码</label><input id="login-passwd" type="password" placeholder="••••••••" autocomplete="current-password" /></div>
        <button type="submit" class="primary">登 录</button>
        <div id="login-msg" class="msg"></div>
      </form>

      <form id="form-register" class="stack hidden">
        <div class="field"><label>服务器</label><input id="gate-url-reg" value="http://127.0.0.1:8080" /></div>
        <div class="field"><label>邮箱</label><input id="reg-email" placeholder="you@example.com" /></div>
        <div class="row">
          <div class="field grow"><label>验证码</label><input id="reg-varifycode" placeholder="6 位验证码" /></div>
          <button id="btn-varify" type="button" class="ghost">获取</button>
        </div>
        <div class="field"><label>用户名</label><input id="reg-user" placeholder="字母/数字" /></div>
        <div class="field"><label>昵称</label><input id="reg-nick" placeholder="可留空" /></div>
        <div class="field"><label>密码</label><input id="reg-passwd" type="password" placeholder="••••••••" /></div>
        <div class="field"><label>确认密码</label><input id="reg-confirm" type="password" placeholder="••••••••" /></div>
        <button type="submit" class="primary">注 册</button>
        <div id="reg-msg" class="msg"></div>
      </form>
      <div class="hint">服务端默认本机 8080；部署在服务器时改为 http://服务器IP:8080</div>
    </div>
  </div>

  <!-- 主界面：三栏（导航 / 会话与联系人 / 聊天） -->
  <div id="view-main" class="main hidden">
    <nav class="nav-rail">
      <div class="nav-logo">W</div>
      <button id="nav-chats" class="nav-btn active" title="消息">
        <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4V6a2 2 0 0 1 2-2z"/></svg>
        <span id="nav-chats-badge" class="nav-badge hidden">0</span>
      </button>
      <button id="nav-contacts" class="nav-btn" title="联系人">
        <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-3.3 0-8 1.7-8 5v1h16v-1c0-3.3-4.7-5-8-5z"/></svg>
        <span id="nav-contacts-badge" class="nav-badge hidden">0</span>
      </button>
      <div class="nav-spacer"></div>
      <div id="me-avatar" class="avatar nav-me">我</div>
      <button id="btn-logout" class="nav-btn" title="退出">
        <svg viewBox="0 0 24 24"><path d="M16 13v-2H7V8l-5 4 5 4v-3h9zm3-10H9a2 2 0 0 0-2 2v3h2V5h10v14H9v-4H7v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>
      </button>
    </nav>

    <!-- 中栏：会话 / 联系人列表 -->
    <aside class="list-pane">
      <div class="list-header">
        <div id="pane-title" class="pane-title">消息</div>
        <div class="search-row">
          <input id="search-input" placeholder="搜索 uid / 用户名" />
          <button id="btn-search" class="icon-btn" title="搜索">🔍</button>
        </div>
      </div>
      <div id="search-result" class="search-result hidden"></div>

      <ul id="session-list" class="list sessions"></ul>

      <div id="contacts-pane" class="hidden pane-contacts">
        <div class="section-title">好友申请</div>
        <ul id="apply-list" class="list applies"></ul>
        <div class="section-title">好友</div>
        <ul id="friend-list" class="list contacts"></ul>
      </div>
    </aside>

    <!-- 右栏：聊天 -->
    <section class="chat-area">
      <header class="chat-title">
        <div id="chat-peer-avatar" class="avatar sm">?</div>
        <div class="chat-peer-info">
          <div id="chat-peer-name">选择一个好友开始聊天</div>
          <div id="chat-peer-uid" class="muted"></div>
        </div>
      </header>
      <div id="msg-list" class="msg-list">
        <div class="system">开始你的第一次对话吧</div>
      </div>
      <div class="composer">
        <button id="btn-img" class="icon-btn big" title="发送图片">📷</button>
        <input type="file" id="img-input" accept="image/*" class="hidden" />
        <textarea id="input-box" rows="1" placeholder="输入消息，Enter 发送（Shift+Enter 换行）"></textarea>
        <button id="btn-send" class="primary send-btn" disabled>发送</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
