name: wetalk

networks:
  wetalk:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  mysql:
    image: mysql:8.0
    container_name: wetalk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    networks:
      wetalk:
        ipv4_address: 172.20.0.10
    healthcheck:
      # 不能只 ping：MySQL 初始化临时实例也会响应 ping。
      # 必须等 01-route-dns / 02-wetalk / 03-chat-tables 三个 init SQL 全部导入完成
      #（wetalk_route 和 wetalk 库都能 USE）才算 healthy，否则 route-dns/reporter/gate
      # 会在 down -v 后的首次启动连不上库直接崩掉。
      # 且必须走 TCP（-h127.0.0.1）：mysql 官方镜像的初始化临时实例是
      # --skip-networking（仅 socket），socket 版 healthcheck 会在临时实例
      # 阶段就误报 healthy，让 route-dns 撞进 mysql 启动窗口而卡死
      #（fresh-deploy 实测必现；数据在库但 dns 无响应）。
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p123456 -N -e 'USE wetalk_route; USE wetalk; SELECT 1;' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: wetalk-redis
    command: ["redis-server", "--requirepass", "123456"]
    networks:
      wetalk:
        ipv4_address: 172.20.0.5

  route-dns:
    build:
      context: .
      dockerfile: docker/Dockerfile.route-dns
    container_name: wetalk-route-dns
    restart: unless-stopped
    # agent 的 tcp_client 连不上不会自动重连，必须等 dns 真正监听 7778 后再启动 agent
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7778' 2>/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      # 宿主文件已改名为 route_*.conf；容器内路径 conf/re_*.conf 是
      # we_reactor 二进制硬编码的读取路径，保留原名（源码已按 WeTalk 内置
      # 组件维护，见 we_reactor/ 内的 WeTalk patch 注释）
      - ./docker/route/route_dns.conf:/app/conf/re_dns.conf:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      wetalk:
        ipv4_address: 172.20.0.20

  route-reporter:
    build:
      context: .
      dockerfile: docker/Dockerfile.route-reporter
    container_name: wetalk-route-reporter
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7779' 2>/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - ./docker/route/route_reporter.conf:/app/conf/re_reporter.conf:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      wetalk:
        ipv4_address: 172.20.0.21

  route-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.route-agent
    container_name: wetalk-route-agent
    restart: unless-stopped
    volumes:
      - ./docker/route/route_agent.conf:/app/conf/re_lb_agent.conf:ro
    depends_on:
      route-dns:
        condition: service_healthy
      route-reporter:
        condition: service_healthy
    networks:
      wetalk:
        ipv4_address: 172.20.0.22

  chat1:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: chat
    container_name: wetalk-chat1
    restart: unless-stopped
    volumes:
      - ./docker/configs/ChatServer1/config.ini:/app/config.ini:ro
    ports:
      - "8090:8090"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      wetalk:
        ipv4_address: 172.20.0.41
        aliases:
          - chatserver1

  chat2:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: chat
    container_name: wetalk-chat2
    restart: unless-stopped
    volumes:
      - ./docker/configs/ChatServer2/config.ini:/app/config.ini:ro
    ports:
      - "8091:8091"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      wetalk:
        ipv4_address: 172.20.0.42
        aliases:
          - chatserver2

  status:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: status
    container_name: wetalk-status
    restart: unless-stopped
    volumes:
      - ./docker/configs/StatusServer/config.ini:/app/config.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      route-agent:
        condition: service_started
    networks:
      wetalk:
        ipv4_address: 172.20.0.31

  varify:
    build:
      context: .
      dockerfile: docker/Dockerfile.varify
    container_name: wetalk-varify
    restart: unless-stopped
    volumes:
      - ./docker/configs/VarifyServer/config.json:/app/config.json:ro
    depends_on:
      redis:
        condition: service_started
    networks:
      wetalk:
        ipv4_address: 172.20.0.32

  gate:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: gate
    container_name: wetalk-gate
    restart: unless-stopped
    volumes:
      - ./docker/configs/GateServer/config.ini:/app/config.ini:ro
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      status:
        condition: service_started
      varify:
        condition: service_started
      resource:
        condition: service_started
    networks:
      wetalk:
        ipv4_address: 172.20.0.30

  resource:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: resource
    container_name: wetalk-resource
    restart: unless-stopped
    volumes:
      - ./docker/configs/ResourceServer/config.ini:/app/config.ini:ro
      - ./docker/data/resource:/app/data
    ports:
      - "9090:9090"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      wetalk:
        ipv4_address: 172.20.0.33

  seed:
    image: mysql:8.0
    container_name: wetalk-seed
    environment:
      CHAT_ADV_IP1: ${CHAT_ADV_IP1}
      CHAT_ADV_IP2: ${CHAT_ADV_IP2}
    entrypoint: ["bash", "/seed/seed.sh"]
    volumes:
      - ./docker/seed/seed.sh:/seed/seed.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
      route-dns:
        condition: service_started
    networks:
      wetalk:
        ipv4_address: 172.20.0.50

volumes:
  mysql-data:
