name: wetalk

networks:
  wetalk:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  mysql:
    image: mysql:8.0
    container_name: wetalk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    networks:
      wetalk:
        ipv4_address: 172.20.0.10
    healthcheck:
      # 不能只 ping：MySQL 初始化临时实例也会响应 ping。
      # 必须等 01-lars-dns / 02-wetalk / 03-chat-tables 三个 init SQL 全部导入完成
      #（lars_dns 和 wetalk 库都能 USE）才算 healthy，否则 lars-dns/reporter/gate
      # 会在 down -v 后的首次启动连不上库直接崩掉。
      test: ["CMD-SHELL", "mysql -uroot -p123456 -N -e 'USE lars_dns; USE wetalk; SELECT 1;' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: wetalk-redis
    command: ["redis-server", "--requirepass", "123456"]
    networks:
      wetalk:
        ipv4_address: 172.20.0.5

  lars-dns:
    build:
      context: .
      dockerfile: docker/Dockerfile.lars-dns
    container_name: wetalk-lars-dns
    restart: unless-stopped
    # agent 的 tcp_client 连不上不会自动重连，必须等 dns 真正监听 7778 后再启动 agent
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7778' 2>/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - ./docker/lars/lars_dns.conf:/app/conf/lars_dns.conf:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      wetalk:
        ipv4_address: 172.20.0.20

  lars-reporter:
    build:
      context: .
      dockerfile: docker/Dockerfile.lars-reporter
    container_name: wetalk-lars-reporter
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7779' 2>/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - ./docker/lars/lars_reporter.conf:/app/conf/lars_reporter.conf:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      wetalk:
        ipv4_address: 172.20.0.21

  lars-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.lars-agent
    container_name: wetalk-lars-agent
    restart: unless-stopped
    volumes:
      - ./docker/lars/lars_lb_agent.conf:/app/conf/lars_lb_agent.conf:ro
    depends_on:
      lars-dns:
        condition: service_healthy
      lars-reporter:
        condition: service_healthy
    networks:
      wetalk:
        ipv4_address: 172.20.0.22

  chat1:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: chat
    container_name: wetalk-chat1
    restart: unless-stopped
    volumes:
      - ./docker/configs/ChatServer1/config.ini:/app/config.ini:ro
    ports:
      - "8090:8090"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      wetalk:
        ipv4_address: 172.20.0.41
        aliases:
          - chatserver1

  chat2:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: chat
    container_name: wetalk-chat2
    restart: unless-stopped
    volumes:
      - ./docker/configs/ChatServer2/config.ini:/app/config.ini:ro
    ports:
      - "8091:8091"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      wetalk:
        ipv4_address: 172.20.0.42
        aliases:
          - chatserver2

  status:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: status
    container_name: wetalk-status
    restart: unless-stopped
    volumes:
      - ./docker/configs/StatusServer/config.ini:/app/config.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      lars-agent:
        condition: service_started
    networks:
      wetalk:
        ipv4_address: 172.20.0.31

  varify:
    build:
      context: .
      dockerfile: docker/Dockerfile.varify
    container_name: wetalk-varify
    restart: unless-stopped
    volumes:
      - ./docker/configs/VarifyServer/config.json:/app/config.json:ro
    depends_on:
      redis:
        condition: service_started
    networks:
      wetalk:
        ipv4_address: 172.20.0.32

  gate:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: gate
    container_name: wetalk-gate
    restart: unless-stopped
    volumes:
      - ./docker/configs/GateServer/config.ini:/app/config.ini:ro
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      status:
        condition: service_started
      varify:
        condition: service_started
      resource:
        condition: service_started
    networks:
      wetalk:
        ipv4_address: 172.20.0.30

  resource:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: resource
    container_name: wetalk-resource
    restart: unless-stopped
    volumes:
      - ./docker/configs/ResourceServer/config.ini:/app/config.ini:ro
      - ./docker/data/resource:/app/data
    ports:
      - "9090:9090"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      wetalk:
        ipv4_address: 172.20.0.33

  seed:
    image: mysql:8.0
    container_name: wetalk-seed
    environment:
      CHAT_ADV_IP1: ${CHAT_ADV_IP1}
      CHAT_ADV_IP2: ${CHAT_ADV_IP2}
    entrypoint: ["bash", "/seed/seed.sh"]
    volumes:
      - ./docker/seed/seed.sh:/seed/seed.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
      lars-dns:
        condition: service_started
    networks:
      wetalk:
        ipv4_address: 172.20.0.50

volumes:
  mysql-data:
